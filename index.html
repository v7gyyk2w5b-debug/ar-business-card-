<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Taurid Media — AR Business Card (test)</title>
<style>
  html { margin: 0; padding: 0; height: 100%; background: #000; }
  body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: transparent;
    position: relative;
  }
  #ar-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  #overlay {
    position: fixed; z-index: 10; top: 0; left: 0; width: 100%;
    padding: 14px 16px; box-sizing: border-box;
    font-family: -apple-system, system-ui, sans-serif; color: #fff;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  #overlay h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  #overlay p { font-size: 12px; margin: 0; opacity: .8; }
  #status {
    position: fixed; z-index: 10; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, system-ui, sans-serif; color: #fff; font-size: 13px;
    background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 20px;
  }
  #debug {
    position: fixed; z-index: 11; bottom: 58px; left: 8px; right: 8px;
    font-family: ui-monospace, monospace; color: #6f6; font-size: 11px;
    background: rgba(0,0,0,.78); padding: 8px 10px; border-radius: 8px;
    max-height: 32vh; overflow-y: auto; white-space: pre-wrap;
  }
  #controls {
    position: fixed; z-index: 12; bottom: 96px; left: 8px; right: 8px;
    display: flex; gap: 8px; justify-content: center;
  }
  #controls button {
    font-family: -apple-system, system-ui, sans-serif; font-size: 13px; font-weight: 600;
    padding: 10px 16px; border-radius: 20px; border: none;
    color: #fff; background: #333;
  }
  #controls button.recording { background: #d32f2f; }
  #controls button:disabled { opacity: .4; }
</style>

<!-- Import map: everything loads from CDN at runtime, no build step needed -->
<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.4/build/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>

<div id="ar-container"></div>

<div id="overlay">
  <h1>Taurid Media — AR test</h1>
  <p>Point at the target card. No app needed.</p>
</div>
<div id="controls">
  <button id="recordBtn">● Record</button>
  <button id="exportBtn" disabled>Export log</button>
</div>
<div id="debug">booting…</div>
<div id="status">Loading…</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const lines = [];
const log = (msg) => {
  lines.push(msg);
  debugEl.textContent = lines.slice(-14).join("\n");
};
window.addEventListener('error', (e) => log("ERR: " + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => log("REJECT: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));
const setStatus = (msg) => { statusEl.textContent = msg; log(msg); };

// --- CONFIG -----------------------------------------------------------
// REAL TARGET: Kyal's compiled business card — now with BOTH faces
// (logo/front + QR/back) compiled into one file as two targets,
// so tracking works whichever side faces the camera.
const TARGET_SRC = "./assets/card.mind";

// REAL SPLAT: Kyal's captured scene, converted from a 397MB full-quality
// PLY export down to mobile-friendly .ksplat files (see convert.mjs /
// decimate_ply.py in the repo for how — SH dropped, splat count reduced,
// weighted to keep higher-opacity/larger splats).
//   scene-light.ksplat = 420k splats, ~10MB  (default — realistic for phones)
//   scene-full.ksplat  = 1.68M splats, ~38MB (higher quality, heavier load)
const SPLAT_SRC = "./assets/scene-light.ksplat";

// Computed from the source PLY's real bounding box (extent ~4.5 x 3.7 x 3.0,
// centroid ~[-0.15, -1.83, -0.02]) so the scene sits at a sensible size
// above the card rather than at capture scale. Starting point only —
// the capture's "up" axis may not match the card's, so rotation will
// likely need visual tuning once you actually see it rendered.
const SPLAT_TRANSFORM = {
  position: [0.0154, 0.409, 0.0023],
  rotation: [0, 0, 0, 1],
  scale: [0.1, 0.1, 0.1],
};
// ------------------------------------------------------------------------

setStatus("Starting camera…");

const mindarThree = new MindARThree({
  container: document.querySelector("#ar-container"),
  imageTargetSrc: TARGET_SRC,
  // Tuning for stability over raw responsiveness — defaults are
  // filterMinCF: 0.001, filterBeta: 1000, warmupTolerance: 5, missTolerance: 5
  filterMinCF: 0.0005,   // lower = smoother pose, less jitter (small added lag)
  filterBeta: 10,        // lower = less overshoot on fast movement (was 1000 — very twitchy)
  warmupTolerance: 3,    // fewer good frames needed before it commits to "found"
  missTolerance: 18,     // was 10 (~170ms @ ~59fps) — real telemetry showed two
                          // near-threshold flicker gaps at 231ms/267ms; 18 frames
                          // (~300ms) bridges those without masking genuine long
                          // feature-loss gaps (765ms-1.45s) seen at extreme tilt
});

const { renderer, scene, camera } = mindarThree;
renderer.setPixelRatio(window.devicePixelRatio);

// Basic light, harmless if the splat viewer doesn't need it
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

const anchors = [0, 1].map((idx) => mindarThree.addAnchor(idx));

// Sets up identical content (control cube + splat) on a given anchor.
// Both faces of the card are separate targets in the compiled .mind file,
// so each needs its own independent cube + splat viewer instance —
// content can't be shared across two different anchor groups.
function setupAnchorContent(anchor, label) {
  const testCube = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 0.2),
    new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true })
  );
  testCube.position.set(0, 0, 0.1);
  anchor.group.add(testCube);

  const splatViewer = new GaussianSplats3D.DropInViewer({
    selfDrivenMode: false,
    dropInMode: true,
    sharedMemoryForWorkers: false,
  });
  anchor.group.add(splatViewer);

  log(`[${label}] loading splat…`);
  splatViewer.addSplatScene(SPLAT_SRC, {
    splatAlphaRemovalThreshold: 5,
    showLoadingUI: false,
    position: SPLAT_TRANSFORM.position,
    rotation: SPLAT_TRANSFORM.rotation,
    scale: SPLAT_TRANSFORM.scale,
  }).then(() => {
    log(`[${label}] splat loaded OK`);
  }).catch((err) => {
    log(`[${label}] SPLAT FAIL: ` + (err && err.message ? err.message : err));
  });

  anchor.onTargetFound = () => setStatus(`TARGET FOUND (${label})`);
  anchor.onTargetLost = () => setStatus("target lost");
}

setupAnchorContent(anchors[0], "face A");
setupAnchorContent(anchors[1], "face B");
log("content wired to both anchors");

// --- TELEMETRY: real per-frame tracking data for diagnosing instability ---
// Captures, for each anchor, every frame: timestamp, visible (found/lost),
// and position/rotation when visible. Exported as JSON so instability can
// be diagnosed from actual data (jitter magnitude, flicker timing) rather
// than guesswork. This only records what already happens on your phone
// during a real test — nothing here is simulated.
let isRecording = false;
let recordStartTime = 0;
const MAX_FRAMES = 4000; // ~2-3 min at 30fps, generous cap to avoid runaway memory
const telemetry = { faceA: [], faceB: [] };
const anchorLabels = ["faceA", "faceB"];
const _pos = new THREE.Vector3();
const _quat = new THREE.Quaternion();
const _scale = new THREE.Vector3();

function recordFrame(elapsedMs) {
  for (let i = 0; i < anchors.length; i++) {
    const g = anchors[i].group;
    const entry = { t: Math.round(elapsedMs), visible: g.visible };
    if (g.visible) {
      g.matrix.decompose(_pos, _quat, _scale);
      entry.pos = [_pos.x, _pos.y, _pos.z].map(v => Math.round(v * 10000) / 10000);
      entry.quat = [_quat.x, _quat.y, _quat.z, _quat.w].map(v => Math.round(v * 10000) / 10000);
    }
    telemetry[anchorLabels[i]].push(entry);
  }
  if (telemetry.faceA.length >= MAX_FRAMES) {
    stopRecording();
    log("auto-stopped: hit frame cap");
  }
}

function startRecording() {
  telemetry.faceA = [];
  telemetry.faceB = [];
  recordStartTime = performance.now();
  isRecording = true;
  recordBtn.textContent = "■ Stop";
  recordBtn.classList.add("recording");
  exportBtn.disabled = true;
  log("recording started");
}

function stopRecording() {
  isRecording = false;
  recordBtn.textContent = "● Record";
  recordBtn.classList.remove("recording");
  exportBtn.disabled = telemetry.faceA.length === 0;
  log(`recording stopped — ${telemetry.faceA.length} frames captured`);
}

function exportLog() {
  const payload = {
    exportedAt: new Date().toISOString(),
    durationMs: telemetry.faceA.length ? telemetry.faceA[telemetry.faceA.length - 1].t : 0,
    frameCount: telemetry.faceA.length,
    faceA: telemetry.faceA,
    faceB: telemetry.faceB,
  };
  const blob = new Blob([JSON.stringify(payload)], { type: "application/json" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `ar-tracking-log-${Date.now()}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
  log("log exported");
}

const recordBtn = document.getElementById("recordBtn");
const exportBtn = document.getElementById("exportBtn");
recordBtn.addEventListener("click", () => isRecording ? stopRecording() : startRecording());
exportBtn.addEventListener("click", exportLog);
// --------------------------------------------------------------------------

const start = async () => {
  await mindarThree.start();
  setStatus("Camera running — looking for target…");
  const clock0 = performance.now();
  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
    if (isRecording) recordFrame(performance.now() - clock0);
  });
};

start().catch((err) => {
  console.error(err);
  setStatus("Camera/AR failed to start — see console");
});
</script>
</body>
</html>
