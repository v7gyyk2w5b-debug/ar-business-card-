<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<title>Taurid Media — AR Business Card (test)</title>
<style>
  html { margin: 0; padding: 0; height: 100%; background: #000; }
  body {
    margin: 0; padding: 0; overflow: hidden; height: 100%;
    background: transparent;
    position: relative;
  }
  #ar-container {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: transparent; overflow: hidden;
  }
  #overlay {
    position: fixed; z-index: 10; top: 0; left: 0; width: 100%;
    padding: 14px 16px; box-sizing: border-box;
    font-family: -apple-system, system-ui, sans-serif; color: #fff;
    background: linear-gradient(rgba(0,0,0,.55), transparent);
    pointer-events: none;
  }
  #overlay h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
  #overlay p { font-size: 12px; margin: 0; opacity: .8; }
  #status {
    position: fixed; z-index: 10; bottom: 18px; left: 50%; transform: translateX(-50%);
    font-family: -apple-system, system-ui, sans-serif; color: #fff; font-size: 13px;
    background: rgba(0,0,0,.55); padding: 8px 14px; border-radius: 20px;
  }
  #debug {
    position: fixed; z-index: 11; bottom: 58px; left: 8px; right: 8px;
    font-family: ui-monospace, monospace; color: #6f6; font-size: 11px;
    background: rgba(0,0,0,.78); padding: 8px 10px; border-radius: 8px;
    max-height: 32vh; overflow-y: auto; white-space: pre-wrap;
  }
</style>

<!-- Import map: everything loads from CDN at runtime, no build step needed -->
<script async src="https://unpkg.com/es-module-shims@1.10.0/dist/es-module-shims.js"></script>
<script type="importmap">
{
  "imports": {
    "three": "https://unpkg.com/three@0.150.0/build/three.module.js",
    "three/addons/": "https://unpkg.com/three@0.150.0/examples/jsm/",
    "mindar-image-three": "https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-three.prod.js",
    "@mkkellogg/gaussian-splats-3d": "https://cdn.jsdelivr.net/npm/@mkkellogg/gaussian-splats-3d@0.4.4/build/gaussian-splats-3d.module.js"
  }
}
</script>
</head>
<body>

<div id="ar-container"></div>

<div id="overlay">
  <h1>Taurid Media — AR test</h1>
  <p>Point at the target card. No app needed.</p>
</div>
<div id="debug">booting…</div>
<div id="status">Loading…</div>

<script type="module">
import * as THREE from 'three';
import { MindARThree } from 'mindar-image-three';
import * as GaussianSplats3D from '@mkkellogg/gaussian-splats-3d';

const statusEl = document.getElementById('status');
const debugEl = document.getElementById('debug');
const lines = [];
const log = (msg) => {
  lines.push(msg);
  debugEl.textContent = lines.slice(-14).join("\n");
};
window.addEventListener('error', (e) => log("ERR: " + (e.message || e)));
window.addEventListener('unhandledrejection', (e) => log("REJECT: " + (e.reason && e.reason.message ? e.reason.message : e.reason)));
const setStatus = (msg) => { statusEl.textContent = msg; log(msg); };

// --- CONFIG -----------------------------------------------------------
// REAL TARGET: Kyal's compiled business card — now with BOTH faces
// (logo/front + QR/back) compiled into one file as two targets,
// so tracking works whichever side faces the camera.
const TARGET_SRC = "./assets/card.mind";

// PLACEHOLDER splat: a generated rainbow point-cloud, just to prove the
// render pipeline works. Swap for your real captured splat later
// (see README.md — "Swap in a real gaussian splat").
const SPLAT_SRC = "./assets/placeholder.splat";
// ------------------------------------------------------------------------

setStatus("Starting camera…");

const mindarThree = new MindARThree({
  container: document.querySelector("#ar-container"),
  imageTargetSrc: TARGET_SRC,
  // Tuning for stability over raw responsiveness — defaults are
  // filterMinCF: 0.001, filterBeta: 1000, warmupTolerance: 5, missTolerance: 5
  filterMinCF: 0.0005,   // lower = smoother pose, less jitter (small added lag)
  filterBeta: 10,        // lower = less overshoot on fast movement (was 1000 — very twitchy)
  warmupTolerance: 3,    // fewer good frames needed before it commits to "found"
  missTolerance: 10,     // more bad frames tolerated before it flips to "lost" — stops flicker
});

const { renderer, scene, camera } = mindarThree;
renderer.setPixelRatio(window.devicePixelRatio);

// Basic light, harmless if the splat viewer doesn't need it
scene.add(new THREE.AmbientLight(0xffffff, 1.0));

const anchors = [0, 1].map((idx) => mindarThree.addAnchor(idx));

// Sets up identical content (control cube + splat) on a given anchor.
// Both faces of the card are separate targets in the compiled .mind file,
// so each needs its own independent cube + splat viewer instance —
// content can't be shared across two different anchor groups.
function setupAnchorContent(anchor, label) {
  const testCube = new THREE.Mesh(
    new THREE.BoxGeometry(0.2, 0.2, 0.2),
    new THREE.MeshBasicMaterial({ color: 0x00ff00, wireframe: true })
  );
  testCube.position.set(0, 0, 0.1);
  anchor.group.add(testCube);

  const splatViewer = new GaussianSplats3D.DropInViewer({
    selfDrivenMode: false,
    dropInMode: true,
    sharedMemoryForWorkers: false,
  });
  anchor.group.add(splatViewer);

  log(`[${label}] loading splat…`);
  splatViewer.addSplatScene(SPLAT_SRC, {
    splatAlphaRemovalThreshold: 5,
    showLoadingUI: false,
    position: [0, 0, 0],
    rotation: [0, 0, 0, 1],
    scale: [1, 1, 1],
  }).then(() => {
    log(`[${label}] splat loaded OK`);
  }).catch((err) => {
    log(`[${label}] SPLAT FAIL: ` + (err && err.message ? err.message : err));
  });

  anchor.onTargetFound = () => setStatus(`TARGET FOUND (${label})`);
  anchor.onTargetLost = () => setStatus("target lost");
}

setupAnchorContent(anchors[0], "face A");
setupAnchorContent(anchors[1], "face B");
log("content wired to both anchors");

const start = async () => {
  await mindarThree.start();
  setStatus("Camera running — looking for target…");
  renderer.setAnimationLoop(() => {
    renderer.render(scene, camera);
  });
};

start().catch((err) => {
  console.error(err);
  setStatus("Camera/AR failed to start — see console");
});
</script>
</body>
</html>
